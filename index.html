<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04060b" />
    <meta name="kaynak" content="globe-repo" />
    <title>Türkiye Pazarı — il ve ilçe ilan haritası</title>
    <meta
      name="description"
      content="İkinci el pazaryeri: Türkiye haritasında il ve ilçe kırılımıyla ilanlar. Yakınlaş, ilçeye in, fiyatı gör."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Archivo:wght@500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="harita" class="harita" aria-label="Türkiye il ve ilçe haritası"></div>

    <nav class="kirinti" id="kirinti" hidden aria-label="Harita konumu">
      <button type="button" data-kirinti="0">Türkiye</button>
    </nav>

    <div class="harita-kontroller">
      <button type="button" data-yakinlas aria-label="yakınlaştır" title="yakınlaştır">+</button>
      <button type="button" data-uzaklas aria-label="uzaklaştır" title="uzaklaştır">−</button>
      <button type="button" data-turkiye aria-label="Türkiye görünümü" title="Türkiye görünümü">⌂</button>
    </div>

    <section class="korokrom" id="korokrom" aria-label="Korokromatik renklendirme">
      <div class="korokrom-bas">
        <span class="korokrom-etiket">korokromatik</span>
        <div class="modlar" role="group" aria-label="Renklendirme ölçütü">
          <button type="button" data-mod="bolge" aria-pressed="true">bölge</button>
          <button type="button" data-mod="yogunluk" aria-pressed="false">yoğunluk</button>
          <button type="button" data-mod="fiyat" aria-pressed="false">fiyat</button>
        </div>
      </div>
      <div class="efsane" id="efsane"></div>
    </section>

    <div class="hud hud--ust">
      <div class="baslik">
        <span class="etiket">İKİNCİ EL PAZARYERİ · v0.5</span>
        <h1>Türkiye Pazarı</h1>
      </div>
      <form class="arama" id="aramaForm" role="search">
        <input
          id="arama"
          type="search"
          name="q"
          placeholder="ne arıyorsun? bisiklet, kamera, koltuk…"
          autocomplete="off"
          spellcheck="false"
          aria-label="İlan ara"
        />
        <span class="arama-sayi" id="aramaSayi">—</span>
      </form>
      <div class="durum" id="durum" role="status" aria-live="polite">yükleniyor</div>
    </div>

    <div class="filtre" id="filtre" aria-label="İlan filtreleri">
      <div class="filtre-satir">
        <div class="filtre-kategoriler" id="filtreKategoriler"></div>
        <div class="filtre-fiyat" id="filtreFiyat"></div>
      </div>
      <div class="filtre-alt">
        <span class="filtre-durum" id="filtreDurum">tüm ilanlar</span>
        <button class="filtre-temizle" id="filtreTemizle" type="button" hidden>filtreleri temizle</button>
      </div>
    </div>

    <div class="hud hud--alt">
      <p class="ipucu" id="ipucu">sürükle: gezin · tekerlek: yakınlaş · il/ilçe: tıkla</p>
      <p class="koordinat" id="koordinat">—</p>
      <p class="pazar-not" id="pazarNot">—</p>
    </div>

    <div class="eylem-cubugu">
      <button class="ilan-ver" id="ilanVer" type="button">
        <span aria-hidden="true">＋</span> ilan ver
      </button>
    </div>

    <div class="ilan-kart" id="ilanKart" hidden aria-live="polite">
      <header>
        <span class="kart-sehir" id="kartSehir"></span>
        <span class="kart-adet" id="kartAdet"></span>
        <button class="kart-kapat" id="kartKapat" type="button" aria-label="kapat">×</button>
      </header>
      <ul class="kart-liste" id="kartListe"></ul>
      <footer class="kart-alt" id="kartAlt"></footer>
    </div>

    <div class="ipucu-kutu" id="ipucuKutu" role="tooltip" hidden>
      <span class="ipucu-tur" id="ipucuTur"></span>
      <span class="ipucu-ad" id="ipucuAd"></span>
      <span class="ipucu-alt" id="ipucuAlt"></span>
    </div>

    <div class="perde" id="perde">
      <div class="perde-ic">
        <div class="ilerleme"><span id="cubuk"></span></div>
        <p class="perde-yazi" id="perdeYazi">harita hazırlanıyor</p>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <b id="toastBaslik"></b>
      <span id="toastAlt"></span>
    </div>

    <section class="detay" id="detay" hidden aria-label="İlan detayı"></section>
    <div class="ekle" id="ekle" hidden aria-label="İlan ekle"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
